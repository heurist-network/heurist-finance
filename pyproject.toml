[project]
name = "heurist-finance"
version = "1.0.0"
description = "Agent workbench for investment research, trading plans and price alerts, on Heurist Mesh"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "exchange-calendars>=4.13.2",
    "httpx>=0.27.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "trafilatura>=2.3.0",
    "yfinance>=1.5.1",
]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { claude-agent-sdk = false }
